name: Daily product hunt

on:
  schedule:
    - cron: "0 2 * * *"        # every day at 02:00 UTC (07:00 Pakistan time)
  workflow_dispatch:            # lets you press a button to run it now

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run hunter
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python hunter.py
